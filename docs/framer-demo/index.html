<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framer Motion Demo</title>
<style>
	body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 24px; background: #0f1115; color: #f4f5f7; }
	h1 { text-align: center; }
	.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; max-width: 800px; margin: 32px auto; }
	.card { opacity: 0; padding: 32px 16px; border-radius: 16px; background: linear-gradient(135deg, #6c5ce7, #00cec9); text-align: center; font-weight: 600; }
	.center { text-align: center; }
	button { padding: 10px 20px; border: 0; border-radius: 8px; background: #fff; color: #0f1115; font-weight: 600; cursor: pointer; }
	.spacer { height: 70vh; }
	.reveal { opacity: 0; max-width: 560px; margin: 0 auto; padding: 24px; border-radius: 12px; background: #1b1f27; }
</style>
</head>
<body>
<h1>Framer Motion Demo</h1>
<div class="grid">
	<div class="card">Sketch</div>
	<div class="card">Figma</div>
	<div class="card">Framer</div>
	<div class="card">Principle</div>
</div>
<p class="center"><button id="replay">Spin cards</button></p>
<div class="spacer"></div>
<div class="reveal">Scroll-triggered reveal using <code>inView</code>.</div>
<div class="spacer"></div>
<script src="bundle.js"></script>
</body>
</html>
